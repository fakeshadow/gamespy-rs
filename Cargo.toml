[workspace]
members = ["crates/gamespy-proto", "crates/gamespy-runtime"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = true
repository = "https://github.com/fakeshadow/gamespy-rs"
authors = ["fakeshadow <everestshadow@gmail.com>"]
readme = "README.md"

[workspace.dependencies]
md5 = "=0.8.0"
gamespy-proto = { path = "crates/gamespy-proto", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
overflow-checks = true
